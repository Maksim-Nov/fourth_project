<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <link rel="stylesheet" href="style.css">

</head>


<body>
    <section id="main">
        <div class="main-block">
            <img src="img/img/maskot.png" width="125">
            <div class="main-content">
                <h1 class="main-title">
                    Максим
                </h1>
                <p class="main-subtitle">
                    личная страница
                </p>
            </div>
            <div class="button">
                <a href="#">Подробнее</a>
            </div>
        </div>
        <img src="img/img/planet.png" class="planet-img">
        <div class="moving-planet"></div> 
    </section>

    <section id="about">
        <h1 class="title">Обо мне</h1>
        <div class="about-block">
            <div class="about-content">
                <div class="about-text">
                    <p class="about-title">Меня зовут Максим, Я занимаюсь разработкой страниц для сайтов.<br><br>
                        я люблю создавать интересные мне проекты.
                    </p>
                    <div class="about-card">
                        <img src="img/img/photo.png">
                        <p>Где живу: Россия</p>
                        <p>Возраст: 16</p>
                        <p>Дата рождения: 2009</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="moving-cloud"></div> 
    </section>

    <section id="skills">
        <div class="skills-block">
        </div>
    </section>

    <section id="works">
        <div class="works-block">
        </div>
    </section>

    <section id="comments">
        <div class="comments-block">
        </div>
    </section>

    <script src="main.js"></script>
</body>

</html>
